services:
  postgres:
    image: postgres:16
    container_name: mpc-products-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mpc_products
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
